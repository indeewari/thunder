name: Release Docs

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo with full history and tags
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      # 2️⃣ Setup PNPM
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3️⃣ Setup Node with PNPM caching
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Point to the lock file inside the docs folder
          cache-dependency-path: docs/pnpm-lock.yaml

      # 4️⃣ Debug: confirm lock file exists
      - name: Check docs lock file
        run: |
          if [ -f docs/pnpm-lock.yaml ]; then
            echo "docs/pnpm-lock.yaml exists"
          else
            echo "WARNING: docs/pnpm-lock.yaml not found"
          fi

      # 5️⃣ Install dependencies in docs folder
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --no-frozen-lockfile

      # 6️⃣ Version docs from tag
      - name: Create docs version from tag
        working-directory: docs
        run: pnpm docs:version:from-tag

      # 7️⃣ Build and deploy docs
      - name: Build & deploy docs
        working-directory: docs
        run: pnpm deploy
        env:
          GIT_USER: github-actions[bot]
